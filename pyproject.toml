[project]
name = "esenin-epub"
version = "0.1.0"
description = "Build a curated Sergei Yesenin poetry + fairy-tale EPUB3 for Kobo from Russian Wikisource."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "pillow>=10.0",
]

[project.scripts]
esenin-epub = "esenin_epub.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esenin_epub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
